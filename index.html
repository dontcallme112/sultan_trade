<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Stockera — официальный дилер электроники в Алматы. Телефоны, ноутбуки, аксессуары с гарантией." />
    <meta name="theme-color" content="#0a0a0a" />
    <meta property="og:title" content="Stockera — электроника в Алматы" />
    <meta property="og:description" content="Официальный дилер. Более 12 000 товаров с гарантией и доставкой по Алматы." />
    <meta property="og:type" content="website" />

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <!-- Preconnect ускоряет загрузку шрифтов -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Шрифты загружаются неблокирующим способом -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    </noscript>

    <!-- Критичные стили инлайн чтобы страница не мерцала -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { font-size: 16px; -webkit-font-smoothing: antialiased; }
      body { font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0a0a; color: #e8e8e8; overflow-x: hidden; }
      #root { min-height: 100vh; }
    </style>

    <title>Stockera — электроника в Алматы</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
